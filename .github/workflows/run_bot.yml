name: Auto Update TheCaptain Trading Signals

on:
  schedule:
    - cron: '0 * * * 1-5'
  workflow_dispatch: 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
    - name: Checkout Repositori
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Pustaka
      working-directory: ./py-engine
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Jalankan Skrip Python
      working-directory: ./py-engine
      run: python main.py

    - name: Commit dan Push Perubahan HTML
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        git add index.html
        git diff-index --quiet HEAD || (git commit -m "Auto-update signals: $(date)" && git push)
